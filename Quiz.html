<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Quiz Helper</title>

    <link rel="stylesheet" href="Quiz.css">
</head>

<body>

    <div class="container">

        <h1>Gemini Quiz Helper</h1>

        <p>Enter a topic and get a simple question and answer.</p>

        <input
            type="text"
            id="topicInput"
            placeholder="Enter topic e.g. Photosynthesis"
        >

        <button onclick="generateQuiz()">
            Generate Quiz
        </button>

        <div id="result"></div>

    </div>

    <script src="Quiz.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Content Generator</title>

    <link rel="stylesheet" href="content.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Content Generator</h1>
        <p>Ask Gemini to generate useful content for you.</p>

        <!-- Feature Buttons -->
        <div class="features">

            <button onclick="selectFeature('ask')">
                Ask Me Anything
            </button>

            <button onclick="selectFeature('summary')">
                Quick Summarizer
            </button>

            <button onclick="selectFeature('ideas')">
                Idea Spark
            </button>

            <button onclick="selectFeature('definition')">
                Definition Finder
            </button>

        </div>

        <!-- Input -->
        <textarea
            id="userInput"
            placeholder="Ask me anything..."
        ></textarea>

        <button class="generate" onclick="generateContent()">
            Generate
        </button> 

        <!-- Result -->
        <div id="result">
            Your AI response will appear here...
        </div>

    </div>

    <script src="content.js"></script>

</body>
</html>
